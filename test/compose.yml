name: dcpost-test
services:
  mysql-test:
    image: mysql:8.4@sha256:da906917ca4ace3ba55538b7c2ee97a9bc865ef14a4b6920b021f0249d603f3d
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: customer_test
      MYSQL_USER: customer_test
      MYSQL_PASSWORD: customer-test-local-only
      MYSQL_ROOT_PASSWORD: customer-test-root-local-only
      TZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - mysql-test-data:/var/lib/mysql
volumes:
  mysql-test-data:
