debug: false
logging:
  level:
    root: INFO
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3306/customer_test?connectionTimeZone=UTC}
    username: ${TEST_DB_USERNAME:customer_test}
    password: ${TEST_DB_PASSWORD:customer-test-local-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
customer:
  shipment:
    sync:
      enabled: false
  auth:
    jwt-secret: isolated-test-signing-key-not-for-deployment-2026
  integration:
    pricing-base-url: http://localhost:8091
    warehouse-base-url: http://localhost:8091
    shipping-base-url: http://localhost:8091
  vnpay:
    return-url: http://localhost:18080/api/v1/payments/vnpay/return
